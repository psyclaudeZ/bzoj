[project]
name = "bzoj"
version = "0.1.0"
description = "Local-only Python judge backend bootstrap"
requires-python = ">=3.14,<3.15"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
